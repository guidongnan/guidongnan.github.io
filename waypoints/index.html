<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="color-scheme" content="light" />
    <title>去处 · Waypoints</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body data-theme="paper">
    <!-- animated colour glows behind everything -->
    <div class="aurora" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <span class="blob b4"></span>
    </div>

    <main class="shell">
      <!-- ===================== LEFT RAIL ===================== -->
      <aside class="rail glass" id="rail" aria-label="Places">
        <button class="sheet-handle" id="railHandle" type="button" aria-label="拖动展开或收起列表"><span class="grip"></span></button>
        <header class="brand">
          <div class="brand-mark">🧭</div>
          <div class="brand-text">
            <h1 data-i18n="brand">Waypoints</h1>
            <span data-i18n="brand_sub">Personal Atlas</span>
          </div>
          <button id="railCollapse" class="icon-btn rail-collapse" type="button" data-i18n-title="collapse_title" title="Collapse" aria-label="Collapse panel">‹</button>
          <button id="langToggle" class="icon-btn" type="button" data-i18n-title="lang_title" title="Language / 语言" aria-label="Language"><span class="lang-code">EN</span></button>
          <button id="themeToggle" class="icon-btn" type="button" data-i18n-title="theme_title" title="Theme (T)" aria-label="Change theme">
            <span class="theme-dot"></span>
          </button>
        </header>

        <label class="search" for="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M21 21l-4.3-4.3M11 18a7 7 0 100-14 7 7 0 000 14z"
            />
          </svg>
          <input id="search" type="search" data-i18n-ph="search_ph" placeholder="Search places, cities, tags…" autocomplete="off" />
          <kbd>/</kbd>
        </label>

        <div class="chips" id="categoryChips" role="group" aria-label="Categories"></div>

        <div class="segmented" id="statusSeg" role="group" aria-label="Status">
          <button class="seg active" data-status="all" type="button" data-i18n="seg_all">All</button>
          <button class="seg" data-status="want" type="button" data-i18n="seg_want">Wishlist</button>
          <button class="seg" data-status="visited" type="button" data-i18n="seg_visited">Visited</button>
          <button class="seg" data-status="fav" type="button">★</button>
        </div>

        <div class="stats" id="stats" aria-label="Summary">
          <div class="stat"><strong id="statTotal">0</strong><span data-i18n="stat_saved">Saved</span></div>
          <div class="stat"><strong id="statVisited">0</strong><span data-i18n="stat_visited">Visited</span></div>
          <div class="stat"><strong id="statPct">0%</strong><span data-i18n="stat_explored">Explored</span></div>
        </div>

        <div class="list" id="placeList" aria-label="Place list"></div>

        <footer class="rail-foot">
          <button id="addBtn" class="ghost-btn primary" type="button" data-i18n="foot_new">＋ New spot</button>
          <div class="foot-tools">
            <button id="importBtn" class="ghost-btn" type="button" data-i18n="foot_import">Import</button>
            <button id="exportBtn" class="ghost-btn" type="button" data-i18n="foot_export">Export</button>
            <button id="resetBtn" class="ghost-btn danger" type="button" data-i18n="foot_reset">Reset</button>
          </div>
        </footer>
      </aside>

      <!-- ===================== MAP STAGE ===================== -->
      <section class="stage" aria-label="Map">
        <div id="map"></div>

        <div class="map-tools">
          <button id="styleBtn" class="tool" type="button" data-i18n-title="tool_style" title="Map style (M)">
            <span class="swatch" id="styleSwatch"></span>
            <span id="styleName">Daylight</span>
          </button>
          <button id="surpriseBtn" class="tool round" type="button" data-i18n-title="tool_surprise" title="Surprise me (R)">🎲</button>
          <button id="pinModeBtn" class="tool round" type="button" data-i18n-title="tool_pin" title="Drop a pin">📍</button>
          <button id="territoryBtn" class="tool round active" type="button" data-i18n-title="tool_territory" title="Visited territory (B)">🗺️</button>
          <button id="locateBtn" class="tool round" type="button" data-i18n-title="tool_locate" title="Fit all">🌍</button>
        </div>

        <div class="pin-hint" id="pinHint" data-i18n="pin_hint" hidden>Tap the map to place a spot · Esc to cancel</div>
      </section>

      <!-- ===================== DETAIL PANEL ===================== -->
      <aside class="detail glass" id="detail" hidden aria-label="Place details"></aside>

      <button id="railReopen" class="rail-reopen" type="button" data-i18n="reopen" hidden>🧭 List</button>
    </main>

    <!-- ===================== EDITOR MODAL ===================== -->
    <div class="modal-backdrop" id="modal" hidden>
      <form class="modal glass" id="editor" autocomplete="off">
        <div class="modal-head">
          <h2 id="editorTitle">新建地点</h2>
          <button type="button" class="icon-btn" id="editorClose" aria-label="Close">✕</button>
        </div>

        <div class="grid">
          <label class="field span2">
            <span data-i18n="f_name">Name</span>
            <input id="fName" type="text" required data-i18n-ph="ph_name" placeholder="e.g. Lingyin Temple" />
          </label>
          <label class="field">
            <span data-i18n="f_en">English name</span>
            <input id="fEn" type="text" placeholder="Lingyin Temple" />
          </label>
          <label class="field">
            <span data-i18n="f_local">Local name</span>
            <input id="fLocal" type="text" data-i18n-ph="ph_local" placeholder="Lingyin Si" />
          </label>
          <label class="field">
            <span data-i18n="f_city">City / region</span>
            <input id="fCity" type="text" placeholder="Hangzhou" />
          </label>
          <label class="field">
            <span data-i18n="f_date">Visit date</span>
            <input id="fDate" type="date" />
          </label>
          <label class="field">
            <span data-i18n="f_category">Category</span>
            <select id="fCategory"></select>
          </label>
          <label class="field">
            <span data-i18n="f_lat">Latitude</span>
            <input id="fLat" type="number" step="any" required placeholder="30.2405" />
          </label>
          <label class="field">
            <span data-i18n="f_lng">Longitude</span>
            <input id="fLng" type="number" step="any" required placeholder="120.1015" />
          </label>
          <label class="field">
            <span data-i18n="f_status">Status</span>
            <select id="fStatus">
              <option value="want" data-i18n="st_want">Wishlist</option>
              <option value="visited" data-i18n="st_visited">Visited</option>
            </select>
          </label>
          <label class="field check">
            <input id="fFav" type="checkbox" />
            <span data-i18n="f_fav">★ Mark as favorite</span>
          </label>
          <label class="field span2">
            <span data-i18n="f_tags">Tags (comma separated)</span>
            <input id="fTags" type="text" placeholder="old town, quiet, autumn" />
          </label>
          <label class="field span2">
            <span data-i18n="f_note">Note</span>
            <textarea id="fNote" rows="3" data-i18n-ph="ph_note" placeholder="Why you want to go…"></textarea>
          </label>
        </div>

        <div class="modal-foot">
          <button type="button" class="ghost-btn danger" id="editorDelete" data-i18n="btn_delete" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" class="ghost-btn" id="editorCancel" data-i18n="btn_cancel">Cancel</button>
          <button type="submit" class="ghost-btn primary" data-i18n="btn_save">Save</button>
        </div>
      </form>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="boundaries.js"></script>
    <script src="landmark-data.js"></script>
    <script src="lm3d.js"></script>
    <script src="data.js"></script>
    <script src="gate.js"></script>
  </body>
</html>
